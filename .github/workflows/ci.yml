name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install audio system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsndfile1

      - name: Install package (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Pytest
        run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t audio-mastering-sidecar:ci .

      - name: Smoke-test /healthz
        run: |
          docker run -d --name ms -p 8000:8000 audio-mastering-sidecar:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz; then echo; ok=1; break; fi
            sleep 2
          done
          if [ -z "${ok:-}" ]; then docker logs ms; docker rm -f ms; exit 1; fi
          docker rm -f ms
